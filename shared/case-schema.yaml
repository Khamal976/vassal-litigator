# Схема case.yaml v8
# Этот файл описывает структуру карточки дела.
# При создании case.yaml через init-case — заполни известные поля, остальные оставь null.
#
# Изменения v2 → v3:
# - Добавлены блоки qualification, jurisdiction (writes: legal-review).
# - Добавлены блоки appeal, cassation (writes: appeal, cassation).
# - Расширено множество значений status: добавлены pending_appeal, pending_cassation.
# - Поля снабжены комментариями `# writes: <скиллы>` — матрица ownership
#   (см. shared/conventions.md, раздел «Ownership полей case.yaml»).
# - Уточнено использование parties[].inn / parties[].ogrn как ключа дедупликации
#   для глобальной памяти (см. shared/conventions.md, раздел «Глобальная память (кросс-дельная)»):
#   add-opponent читает inn оппонента и пишет наблюдения в $VASSAL_GLOBAL_DIR/counterparties/inn-{ИНН}.md.
#   При отсутствии inn используется fallback noinn-{slug-name}.md, точность дедупликации падает.
#
# Изменения v3 → v4:
# - Добавлен блок settlement (writes: settlement; частично analyze-hearing для confirmed_date).
# - Расширено множество значений status: добавлены pending_settlement, settled, withdrawn.
# - В блок cassation добавлены target + appealed_ruling_doc_id — под обжалование
#   определений по ст. 141 АПК (мировое) и ст. 151 АПК (прекращение производства),
#   которые идут в кассацию минуя апелляцию.
#
# Изменения v4 → v5 (WS-1a, профиль банкротства):
# - Расширен enum case.category (трудовой спор, корпоративный, КАС, ГПК-исковое);
#   старое значение "экономические споры" принимается как синоним "исковое (АПК)".
# - В parties[].role добавлены банкротные роли (Должник, Арбитражный управляющий,
#   Кредитор, Уполномоченный орган, СРО, КДЛ) + Прокурор (ст. 45 ГПК).
#   Добавлено поле parties[].role_detail (подтип роли: стадийный для АУ, статусный для кредитора).
# - Добавлен блок bankruptcy: (writes: init-case, legal-review) — машиночитаемое хранилище
#   банкротной специфики: процедура, ДАТА ЗАКРЫТИЯ РЕЕСТРА (потеря = потеря очерёдности),
#   публикация (Коммерсантъ/ЕФРСБ), тип должника, ссылка на АУ + СРО, основание участия клиента.
# - Добавлены поля production_type / production_type_basis / production_type_set_by /
#   production_type_set_date (writes: init-case, legal-review) — снят дрейф со справочником
#   production-types.md §6 и init-case фаза 3 (поля писались, но в схеме отсутствовали).
#
# Изменения v5 → v6 (WS-1c, постапелляционный вход — F1.8):
# - В блоки appeal/cassation добавлены поля-пометки источника: origin (computed | intake),
#   _set_by, _set_date. Позволяют init-case зафиксировать ФАКТИЧЕСКИ известные данные
#   обжалования при входе в дело на постапелляционной/посткассационной стадии (origin=intake),
#   отделив их от РАСЧЁТНЫХ значений скиллов appeal/cassation (origin=computed по умолчанию).
#   Добавочные поля; карточки v5 валидны (отсутствие origin трактуется как computed).
#
# Изменения v6 → v7 (F.21, стадия исполнения):
# - Добавлен блок enforcement: (writes: enforcement-adjustment, settlement, init-case,
#   analyze-hearing) — реквизиты исполнительного листа и исполнительного производства
#   плюс вложенный adjustment: под заявление по ст. 324 АПК / ст. 203, 434 ГПК / ст. 358 КАС
#   (отсрочка, рассрочка, изменение способа и порядка, исполнительский сбор).
# - Расширено множество значений status: добавлено enforcement (идёт принудительное
#   исполнение) — прежде стадия между вступлением акта в силу и completed не выражалась.
# - Закрыта тихая потеря: settlement на stage='enforcement' печатает в просительной части
#   номер исполнительного производства и серию/номер исполнительного листа, а полей
#   для них в схеме не было — данные собирались в диалоге и никуда не ложились.
# - Добавочные поля; карточки v6 валидны (отсутствие блока enforcement трактуется как
#   «дело до стадии исполнения не дошло»).
#
# Изменения v7 → v8 (состязательная проверка блока 3 — порча данных в карточке):
# - Разведены «что просим» и «что суд дал»: добавлены enforcement.adjustment.requested_until
#   и .requested_schedule. Прежде и просьба, и результат писались в granted_until/schedule,
#   а от granted_until пересчитывается writ_deadline — то есть карточка показывала отсрочку
#   и неверный срок предъявления листа ДО того, как суд что-либо решил.
# - Добавлен enforcement.adjustment.draft_date (по образцу settlement.draft_date): документ
#   подготовлен ≠ подан. in_progress теперь поднимается только вместе с filed_date.
# - Добавлен enforcement.adjustment_history[] — заявлений по одному листу штатно бывает
#   несколько (повтор после отказа, заявление оппонента, заявление пристава, разные kind),
#   а слот adjustment был один: второй эпизод затирал первый.
# - Добавлен enforcement.our_role (debtor | creditor). Право по ч. 1 ст. 324 АПК принадлежит
#   обеим сторонам, а скилл по умолчанию считал клиента должником.
# - Снят неверный комментарий о стандарте для method_change (п. 35 ППВС № 50 от 17.11.2015
#   посвящён окончанию исполнительного производства и такого стандарта не содержит);
#   для kind='fee' отмечено, что ч. 2.1 ст. 324 АПК — процедура, а не правовой тест.
# - Добавочные поля; карточки v7 валидны.

version: 8

case:
  number: "А33-12345/2026"         # writes: init-case   | Номер дела. null если дело ещё не возбуждено.
  court: "Название суда"            # writes: init-case   | Полное название суда
  judge: "ФИО судьи"               # writes: init-case, analyze-hearing  | null если неизвестно
  category: "исковое (АПК)"         # writes: init-case   | Субстантивная категория спора — КЛЮЧ РОУТИНГА
                                    # к секциям references (банкротные / трудовые / КАС сроки и структура).
                                    # Допустимые значения:
                                    #   исковое (АПК)          — экономический спор в исковом порядке (АПК, гл. 13-21)
                                    #   банкротство            — дело о несостоятельности (ФЗ-127; спец. производство)
                                    #   корпоративный спор     — гл. 28.1 АПК (ст. 225.1)
                                    #   административное (АПК)  — оспаривание ненормативных актов/решений в АС (гл. 24-26 АПК)
                                    #   исковое (ГПК)          — гражданское исковое в СОЮ
                                    #   трудовой спор          — индивидуальный трудовой спор (ТК; СОЮ, общеисковое)
                                    #   административное (КАС)  — публичные правоотношения в СОЮ (КАС РФ)
                                    # Совместимость: старое "экономические споры" = синоним "исковое (АПК)" (v4-карточки не ломаются).
                                    # Процессуальный кодекс/инстанция фиксируется отдельно — case.jurisdiction.competent_court.
  subject: "Суть спора в 1 предложении"  # writes: init-case
  status: active                    # writes: init-case, appeal, cassation, analyze-hearing, settlement,
                                    #         enforcement-adjustment
                                    # Допустимые значения:
                                    #   active               — дело в работе (1 инстанция)
                                    #   suspended            — приостановлено судом
                                    #   pending_appeal       — решение вынесено, готовим/подали апелляцию
                                    #   pending_cassation    — апелляция рассмотрена, готовим/подали кассацию
                                    #   pending_settlement   — settlement-трек активен, утверждения суда ещё нет (writes: settlement)
                                    #   settled              — мировое утверждено судом (writes: settlement)
                                    #   withdrawn            — производство прекращено по отказу истца от иска (writes: settlement)
                                    #   enforcement          — акт вступил в силу, идёт принудительное исполнение
                                    #                          (writes: enforcement-adjustment). Отличается от completed:
                                    #                          completed — исполнено, enforcement — исполняется.
                                    #                          Реквизиты ИЛ и ИП — в блоке case.enforcement
                                    #   completed            — судебные акты вступили в силу, исполнено
                                    #   archived             — дело закрыто и убрано в архив
                                    # Признание иска отдельного статуса не получает: оно ведёт к решению,
                                    # дальше обычная цепочка (completed / pending_appeal).

  # Даты
  filing_date: null                 # writes: init-case   | Дата подачи иска (ГГГГ-ММ-ДД)
  next_hearing: null                # writes: init-case, analyze-hearing  | Дата следующего заседания
  next_hearing_source: null         # writes: init-case, analyze-hearing  | user | transcript | kad

  # Стороны
  # Каждая сторона имеет стабильный party_id для ссылок из других структур.
  # Формат party_id: {слаг-роли}-{NN}. Слаги по профилю:
  #   Исковые:    plaintiff | defendant | third-party | applicant | interested
  #   Банкротные: debtor | manager (АУ) | creditor | authority (уполн. орган) | sro | cdl (КДЛ)
  #   СОЮ:        prosecutor (Прокурор, ст. 45 ГПК)
  # Примеры: plaintiff-01, defendant-01, creditor-01, creditor-02, manager-01.
  # writes: init-case (структура), legal-review (уточнение реквизитов после анализа документов)
  #
  # ВАЖНО для оппонента (роль ≠ роли our_client):
  # - inn/ogrn -- ключ дедупликации в глобальной памяти $VASSAL_GLOBAL_DIR/counterparties/.
  # - Если inn известен (даже из шапки иска / отзыва) -- заполнить ОБЯЗАТЕЛЬНО при init-case
  #   или дополнить через legal-review после анализа документов оппонента.
  # - Без inn add-opponent использует fallback noinn-{slug-name}.md, что снижает точность
  #   кросс-дельного матчинга (омонимы, разные правописания одного контрагента).
  parties:
    - party_id: "plaintiff-01"
      role: "Истец"                 # Допустимые значения роли:
                                    #   Исковые:    Истец | Ответчик | Третье лицо | Заявитель | Заинтересованное лицо
                                    #   Банкротные: Должник | Арбитражный управляющий | Кредитор |
                                    #               Уполномоченный орган | СРО | Контролирующее должника лицо (КДЛ)
                                    #   СОЮ:        Прокурор (ст. 45 ГПК)
      role_detail: null             # Подтип роли (где применимо), иначе null:
                                    #   для "Арбитражный управляющий" — стадийный подтип:
                                    #     временный (наблюдение) | административный (фин. оздоровление) |
                                    #     внешний (внешнее управление) | конкурсный (конкурсное производство) |
                                    #     финансовый (банкротство гражданина).
                                    #     Источник истины о стадии — case.bankruptcy.procedure;
                                    #     role_detail обновляется согласованно с ней (writes: legal-review).
                                    #   для "Кредитор" — статусный подтип:
                                    #     заявитель по делу | реестровый | зареестровый | текущий
      name: "Полное наименование"
      short_name: "Краткое"
      inn: null                     # ИНН (10 или 12 цифр) -- для оппонента ключ глобальной памяти, см. выше
      ogrn: null                    # ОГРН (13 или 15 цифр) -- доп. идентификатор
      address: null                 # Юридический адрес
      representative: null          # ФИО представителя стороны

    - party_id: "defendant-01"
      role: "Ответчик"
      role_detail: null             # см. перечень подтипов у plaintiff-01 выше
      name: "Полное наименование"
      short_name: "Краткое"
      inn: null                     # ИНН -- ключ глобальной памяти для оппонента
      ogrn: null
      address: null
      representative: null

  # Наш клиент — ссылка на party_id
  our_client:
    party_id: "defendant-01"        # writes: init-case   | Какая из сторон — наш клиент

  # Представитель (наш юрист)
  # writes: init-case
  representative:
    name: null                      # ФИО
    short_name: null                # Инициалы: "Я. А. Стригов"
    position: "Представитель"
    power_of_attorney: null         # "Доверенность от ДД.ММ.ГГГГ"
    address: null
    phone: null
    email: null

  # Суммы
  # writes: init-case (исходные значения), build-position (уточнение в ходе расчётов)
  amounts:
    claim: null                     # Сумма иска (число)
    court_fee: null                 # Госпошлина (число)

  # Порядок производства — процессуальная квалификация по сумме+категории (НЕ выбор истца).
  # Определяется init-case (фаза 3, при наличии amounts.claim) по алгоритму
  # legal-review/references/production-types.md §6; уточняется legal-review при анализе материалов.
  # writes: init-case, legal-review
  # reads:  build-position, prepare-hearing, appeal (срок апелляции: упрощёнка — 15 дней vs 1 месяц)
  # N/A для category ∈ {банкротство, корпоративный спор, административное (КАС)} — спец. производство:
  #   остаётся null (ветка init-case "category=банкротство" пропускает определение).
  production_type: null             # приказное | упрощённое | общеисковое | null
  production_type_basis: null       # Обоснование с нормой, напр.:
                                    #   "ст. 227 ч. 1 п. 1 АПК — цена иска 850 000 ₽ для юрлица,
                                    #    в пределах 1 200 000 ₽ (ред. ФЗ № 667-ФЗ от 25.12.2023)"
  production_type_set_by: null      # init-case | legal-review — кто зафиксировал
  production_type_set_date: null    # ГГГГ-ММ-ДД

  # Квалификация правоотношений — заполняется на этапе legal-review
  # writes: legal-review, build-position (может уточнить applicable_norms)
  # reads: build-position, prepare-hearing, appeal, cassation
  qualification:
    relation_type: null             # поставка | подряд | услуги | аренда | заём | неосновательное обогащение | ...
    applicable_norms: []            # Список ключевых норм: ["ст. 506 ГК", "ст. 711 ГК", "ФЗ о контрактной системе"]
    qualified_by: null              # agent | user
    qualified_at: null              # Дата квалификации (ГГГГ-ММ-ДД)

  # Подсудность — заполняется на этапе legal-review
  # writes: legal-review; confirmed_by_user — дополнительно prepare-hearing (F.9)
  # reads: build-position, prepare-hearing, appeal, cassation
  jurisdiction:
    competent_court: null           # арбитражный | СОЮ | КАС | банкротный
    territorial_basis: null         # общая | договорная | исключительная | альтернативная
    correct: null                   # true | false | null — соответствует ли фактическая подсудность правильной
    prorogation_clause: null        # Текст оговорки о подсудности из договора (или null)
    # F.9 — статус вывода о компетенции; читается перед первичной подачей (prepare-hearing и др.
    # document-producing скиллы). Ниже высокой = блок первичной подачи до подтверждения Сюзерена.
    # См. shared/conventions.md → «Статус вывода о компетенции (F.9)»
    confidence: null                # высокая | средняя | низкая — та же оценка, что в аудируемом выводе
    confirmed_by_user: null         # true | false | null — Сюзерен явно подтвердил форум (снимает блок)
    # F.6 — след шага 0 «специальная норма о компетенции в профильном законе»
    special_norm_checked: null      # true | false — профильный закон открывали (пустой результат тоже валиден)
    special_norm: null              # Найденная норма ("п. 12 ст. 20 ФЗ-127") или null, если не найдена

  # Досудебный порядок — заполняется на этапе legal-review, не при init-case
  # writes: legal-review (обязательность и факт соблюдения),
  #         draft-claim (всё остальное: применённая норма, сроки, реквизиты направления, ответ)
  # reads:  legal-review, draft-claim, prepare-hearing, build-position, study-evidence
  #
  # ⚠️ Три РАЗНЫЕ шкалы времени, их нельзя смешивать (B.20):
  #   A. response_deadline_days — сколько дней мы дали должнику (пишем в тексте претензии)
  #   B. claim_ready_date       — с какой даты возникает право на иск
  #   C. приостановление исковой давности — считается отдельно, в поле не хранится
  # По абз. 1 ч. 5 ст. 4 АПК шкала B считается со дня НАПРАВЛЕНИЯ претензии.
  # По специальным нормам точка отсчёта иная — см. deadline_start_from.
  pretrial:
    required: null                  # true | false | null
    required_source: null           # user | agent | document
    complied: null                  # true | false | null
    complied_source: null           # user | agent
    pretrial_date: null             # Дата фактического направления претензии (ГГГГ-ММ-ДД).
                                    # НЕ заполняется при генерации — только микро-шагом
                                    # «претензия направлена», когда отправка состоялась.
    pretrial_date_source: null      # user | document — из чата Сюзерена либо извлечено
                                    # из квитанции / описи / отчёта об отслеживании
    pretrial_date_evidence: null    # doc_id документа-источника, если source = document

    # --- Правовое основание и сроки (пишет draft-claim) ---
    basis_norm: null                # Норма, из которой следует обязательность
                                    # ("абз. 1 ч. 5 ст. 4 АПК", "ст. 124 УЖТ", "п. 2 ст. 452 ГК")
    basis_source: null              # law | contract — законный или договорный порядок
    wait_period_days: null          # Срок ожидания перед иском (30 по общей норме АПК)
    deadline_start_from: null       # sending | receipt | registration — точка отсчёта шкалы B.
                                    # sending — общая норма АПК; receipt — транспорт;
                                    # registration — связь (п. 4 ст. 55 ФЗ № 126-ФЗ)
    response_deadline_days: null    # Шкала A: срок, который мы дали должнику в тексте
    claim_ready_date: null          # Шкала B: дата, с которой можно подавать иск (ГГГГ-ММ-ДД).
                                    # Расчётное поле — заполняется вместе с pretrial_date

    # --- Реквизиты направления (пишет draft-claim) ---
    sent_method: null               # почта-заказное | почта-ценное-с-описью | нарочно |
                                    # курьер | email | ЭДО
    sent_to_address: null           # Адрес, по которому направлено
    address_basis: null             # ЕГРЮЛ | ЕГРИП | договор | указан-адресатом
    tracking: null                  # Трек-номер / реквизиты подтверждения отправки
    amount: null                    # Сумма требования на дату претензии (основной долг +
                                    # неустойка + проценты), одной строкой с разбивкой

    # --- Ответ адресата (пишет draft-claim) ---
    reply_received: null            # true | false | null
    reply_date: null                # Дата получения ответа (ГГГГ-ММ-ДД)
    reply_admits_debt: null         # true | false | null — есть ли в ответе признание долга.
                                    # Признание прерывает исковую давность (ст. 203 ГК);
                                    # ответ без указания на признание сам по себе признанием
                                    # НЕ является (п. 20 ППВС № 43)

    # --- Входящая претензия к нам (режим draft-claim mode=reply) ---
    incoming: null                  # null либо блок с теми же по смыслу полями:
                                    # doc_id, received_date, claimed_amount, response_due_date,
                                    # response_obligatory (true для перевозчика / оператора
                                    # связи / туроператора), our_reply_doc_id

  # Банкротный профиль — заполняется ТОЛЬКО при case.category = "банкротство".
  # Для прочих категорий блок отсутствует или весь null.
  # writes: init-case (структура + известное из материалов: процедура, даты публикации, тип должника),
  #         legal-review (registry_close_date как расчётный правовой вывод, уточнение procedure / дат)
  # reads:  build-position, prepare-hearing, appeal, cassation, legal-review
  bankruptcy:
    debtor_type: null               # юрлицо | ИП | гражданин
                                    # Определяет применимый набор процедур (граждане:
                                    # реструктуризация долгов / реализация имущества).
    debtor_party_id: null           # ссылка на parties[].party_id должника (обычно debtor-01)

    procedure: null                 # Текущая процедура:
                                    #   наблюдение | финансовое оздоровление | внешнее управление |
                                    #   конкурсное производство            — юрлица / ИП
                                    #   реструктуризация долгов | реализация имущества
                                    #                                      — граждане
                                    # Ключ роутинга reference-секции; от процедуры зависят реестровые
                                    # сроки (наблюдение — 30 дн с публикации, ст. 71 ФЗ-127;
                                    # конкурс — реестр 2 мес с публикации, ст. 142 ФЗ-127).
    procedure_introduced_date: null # Дата введения текущей процедуры (определение суда), ГГГГ-ММ-ДД
    case_opened_date: null          # Дата принятия судом заявления о признании должника банкротом
                                    # (= дата возбуждения дела; отождествление — п. 7 ППВАС № 35
                                    #  от 22.06.2012, сами нормы гл. III.1 говорят «принятие заявления»).
                                    # ЯКОРЬ периодов подозрительности и предпочтения по гл. III.1:
                                    #  1 мес (п. 2 ст. 61.3) / 6 мес (п. 3 ст. 61.3) /
                                    #  1 год (п. 1 ст. 61.2) / 3 года (п. 2 ст. 61.2).
                                    # ⚠️ При НЕСКОЛЬКИХ заявлениях о банкротстве хранить дату принятия
                                    #  ПЕРВОГО заявления, независимо от того, какое признано
                                    #  обоснованным (п. 7 ППВАС № 35) — иначе периоды уедут на месяцы.
                                    # Потребитель: study-evidence (профиль `payments`, G.3).

    # Публикация сведений — якорь отсчёта реестровых сроков.
    publication:
      source: null                  # Коммерсантъ | ЕФРСБ
                                    # (Коммерсантъ — офиц. печатный орган; ЕФРСБ — fedresurs.ru.
                                    #  Для разных сроков релевантна разная публикация — хранить факт.)
      date: null                    # Дата публикации, ГГГГ-ММ-ДД — точка отсчёта 30 дн / 2 мес
      message_number: null          # Номер сообщения ЕФРСБ / номер и дата газеты (для проверяемости)

    # КРИТИЧНО (P0). Дата закрытия реестра требований кредиторов.
    # После неё требование нашего кредитора — зареестровое (удовлетворяется после реестровых).
    # Расчёт: как правило publication.date (конкурс) + 2 месяца (ст. 142 ФЗ-127);
    # для наблюдения — 30 дн с публикации для участия в первом собрании (ст. 71 ФЗ-127).
    # Хранить ФАКТИЧЕСКУЮ дату — на неё завязаны дедлайны build-position / prepare-hearing.
    registry_close_date: null       # ГГГГ-ММ-ДД
    registry_close_basis: null      # норма + от какой публикации считали (текст, для аудита)

    manager_party_id: null          # ссылка на parties[].party_id АУ (обычно manager-01;
                                    # сам АУ заводится как parties[] с role="Арбитражный управляющий")
    manager_sro: null               # Наименование СРО, членом которой состоит АУ
                                    # (важно для дел о замене СРО / жалоб на АУ; защита СРО).

    # Основание участия НАШЕГО клиента — почему мы здесь и в каком качестве (свободный текст).
    # Примеры: "кредитор-заявитель, требование 1,26 млрд из договора поставки";
    #          "СРО, защищаем АУ от жалобы должника на ненадлежащее исполнение".
    our_position_basis: null

  # Settlement — мировое соглашение / отказ от иска / признание иска
  # writes: settlement (основные поля), analyze-hearing (confirmed_date после заседания,
  #         если суд утвердил / принял отказ / принял признание прямо в нём)
  # reads: prepare-hearing (для хука «у нас активный settlement»),
  #        cassation (если confirmed_date != null и обжалуется определение по ст. 141 АПК)
  settlement:
    mode: null                      # MVP-валидатор: 'agreement' | 'withdrawal' | 'admission'
                                    #   agreement  — мировое соглашение (ст. 138-142 АПК).
                                    #                Допустимо на любой стадии и в исполнительном производстве
                                    #                (ст. 139 ч. 1 АПК); см. совместимость со stage ниже.
                                    #   withdrawal — отказ от иска нашим истцом (ст. 49 ч. 2, 150 ч. 1 п. 4 АПК).
                                    #                Возможен до удаления суда в совещательную комнату в 1 инст.;
                                    #                в апелляции/кассации — как результат примирения по ст. 138.6
                                    #                АПК (отказ принимается судом проверочной инстанции).
                                    #   admission  — признание иска нашим ответчиком (ст. 49 ч. 3 АПК).
                                    #                По существу — институт первой инстанции. После вынесения
                                    #                решения 1 инст. признание иска как самостоятельный
                                    #                инструмент бессмысленно (предмет уже разрешён);
                                    #                в проверочных инстанциях аналогичную задачу решает либо
                                    #                мировое (mode='agreement'), либо отказ от жалобы
                                    #                (mode='appeal_withdrawal', пост-MVP). Поэтому MVP-валидатор
                                    #                для admission допускает только stage='1inst'.
                                    # Зарезервированы под пост-MVP расширения по ст. 138.6 АПК:
                                    #   appeal_withdrawal       — отказ от апелляционной/кассационной жалобы
                                    #   facts_agreement         — соглашение по обстоятельствам (ст. 70 ч. 2 АПК)
                                    #   circumstances_admission — признание обстоятельств
                                    #   tm_consent              — письмо-согласие на регистрацию товарного знака
                                    # При попытке записать зарезервированное значение в MVP — отказать.
    initiator: null                 # 'us' | 'opponent' | 'mutual' — кто инициировал трек
    stage: null                     # '1inst' | 'appeal' | 'cassation' | 'enforcement' — стадия,
                                    # на которой заключается результат примирения.
                                    # Последствия для процесса различаются по стадии (ст. 141 АПК):
                                    #   1inst       — утверждение мирового / принятие отказа от иска →
                                    #                  прекращение производства по делу.
                                    #                  Госпошлина: возврат 70% по ст. 333.40 НК.
                                    #   appeal      — утверждение мирового / принятие отказа →
                                    #                  ОТМЕНА решения 1 инст. + прекращение производства
                                    #                  (ст. 141 ч. 13 АПК). Госпошлина: возврат 50%.
                                    #   cassation   — утверждение мирового / принятие отказа →
                                    #                  ОТМЕНА актов нижестоящих инстанций + прекращение
                                    #                  производства. Госпошлина: возврат 30%.
                                    #   enforcement — мировое утверждается судом 1 инст. (по месту
                                    #                  исполнения судебного акта); определение влечёт
                                    #                  прекращение исполнительного производства
                                    #                  (ст. 43 ч. 2 п. 3 ФЗ-229). Возврат госпошлины
                                    #                  по делу не производится (уже исчерпана исполнением).
                                    # Эти последствия SKILL settlement учитывает в фазе 4 через
                                    # ветвление просительной части ходатайства об утверждении (отмена
                                    # нижестоящих актов / прекращение исполнительного производства).
                                    # Совместимость mode × stage (MVP-валидатор):
                                    #   agreement  × {1inst, appeal, cassation, enforcement} — OK.
                                    #   withdrawal × {1inst, appeal, cassation}              — OK.
                                    #   withdrawal × enforcement                              — отказать
                                    #     (на стадии исполнения отказ от иска утратил смысл — иск удовлетворён).
                                    #   admission  × 1inst                                    — OK.
                                    #   admission  × {appeal, cassation, enforcement}         — отказать
                                    #     (см. пояснение к mode='admission' выше).
    draft_date: null                # Дата подготовки проекта документа (ГГГГ-ММ-ДД)
    filed_date: null                # Дата подачи в суд
    confirmed_date: null            # Дата определения суда об утверждении мирового / о принятии отказа /
                                    # или решения суда о принятии признания иска
    court_ruling_id: null           # doc-id определения/решения суда в index.yaml (если попало в индекс)
    in_progress: false              # true пока трек активен (между draft_date и confirmed_date или отменой);
                                    # false после confirmed_date или явной отмены трека Сюзереном.
                                    # prepare-hearing читает это поле в фазе 2 п.13 для хука.

  # Апелляционная инстанция — заполняется при вынесении решения и подаче жалобы
  # writes: appeal (расчётные поля), analyze-hearing (hearing_date, ruling_date после заседания),
  #         init-case (фактические поля при постапелляционном входе — origin=intake, F1.8)
  # reads: cassation (для расчётов сроков и проверки последовательности)
  appeal:
    origin: computed                # computed (рассчитано/ведёт appeal) | intake (зафиксировано init-case при постапелляционном входе со слов/из материалов)
    _set_by: null                   # appeal | init-case | analyze-hearing — кто последним писал блок
    _set_date: null                 # дата записи (ISO)
    judgment_issued_date: null      # Дата изготовления решения 1 инстанции в полном объёме
    deadline: null                  # Расчётный срок подачи жалобы (judgment_issued_date + 1 месяц по АПК)
    filed_date: null                # Когда фактически подали апелляционную жалобу
    hearing_date: null              # Дата заседания апелляционной инстанции
    ruling_date: null               # Дата вынесения постановления апелляции
    result: null                    # upheld | overturned | modified | dismissed | null
                                    #   upheld     — решение оставлено без изменения
                                    #   overturned — отменено
                                    #   modified   — изменено
                                    #   dismissed  — производство по жалобе прекращено

  # Кассационная инстанция — симметрично appeal
  # writes: cassation (расчётные поля), analyze-hearing (hearing_date, ruling_date),
  #         init-case (фактические поля при посткассационном входе — origin=intake, F1.8)
  cassation:
    origin: computed                # computed (рассчитано/ведёт cassation) | intake (зафиксировано init-case при посткассационном входе)
    _set_by: null                   # cassation | init-case | analyze-hearing — кто последним писал блок
    _set_date: null                 # дата записи (ISO)
    target: null                    # На какой судебный акт жалоба:
                                    #   judgment_with_appeal — стандартный путь: решение 1 инст. + постановление апелляции
                                    #   ruling_settlement    — определение об утверждении мирового (обжалование — ст. 141 ч. 11 АПК;
                                    #                          ч. 9 — немедленное исполнение): обжалуется в кассации МИНУЯ апелляцию, срок 1 месяц
                                    #   ruling_termination   — определение о прекращении производства (ст. 151 АПК):
                                    #                          обжалуется в апелляции, но если апелляция отказала —
                                    #                          в кассации; используется когда target суда — определение
                                    # null до выбора в фазе 0 cassation.
    appealed_ruling_doc_id: null    # doc-id обжалуемого определения, если target != 'judgment_with_appeal'
                                    # (для ruling_settlement / ruling_termination — это id определения в index.yaml).
    appeal_ruling_date: null        # Дата вступления в силу постановления апелляции (точка отсчёта срока)
                                    # При target != 'judgment_with_appeal' — null; вместо этого используется
                                    # дата вынесения обжалуемого определения, она же deadline -1 месяц/2 месяца.
    deadline: null                  # Расчётный срок подачи кассации:
                                    #   judgment_with_appeal: appeal_ruling_date + 2 месяца (ст. 276 АПК);
                                    #   ruling_settlement:    дата определения + 1 месяц (ст. 141 ч. 11 АПК);
                                    #   ruling_termination:   по общим правилам обжалования определений.
    filed_date: null                # Когда подали кассационную жалобу
    hearing_date: null              # Дата заседания кассационной инстанции
    ruling_date: null               # Дата вынесения постановления кассации
    result: null                    # upheld | overturned | modified | dismissed | null
    instance: null                  # окружной/СИП | КСОЮ | СКЭС ВС РФ | СКГД ВС РФ — какая кассация (1 или 2; АПК и ГПК)

  # Исполнительное производство и корректировка исполнения
  # (ст. 324 АПК / ст. 203, 203.1, 434 ГПК / ст. 358 КАС / ФЗ-229 «Об исполнительном производстве»)
  # Заполняется, когда дело дошло до стадии принудительного исполнения. Для дел, не дошедших
  # до неё, блок отсутствует или весь null.
  # Правовой профиль — skills/legal-review/references/enforcement-reference.md
  #
  # writes: enforcement-adjustment (блок adjustment + реквизиты, если их ещё нет) — ЕДИНСТВЕННЫЙ,
  #         кто реализован полностью;
  #         settlement (writ_* и proceeding_number при mode='agreement' × stage='enforcement' —
  #                     просительная часть требует их дословно) — читает реализовано, запись нет;
  #         legal-review (фиксирует известное при детекте стадии исполнения — реализовано,
  #                       раньше числился только читателем)
  # reads:  enforcement-adjustment, settlement, legal-review
  #
  # ⚠️ ЗАЯВЛЕНО, НО НЕ РЕАЛИЗОВАНО (проверено грепом 2026-07-29 — 0 упоминаний `enforcement`
  # в SKILL.md каждого): init-case (реквизиты при входе в дело сразу на стадии исполнения,
  # origin=intake), analyze-hearing (adjustment.hearing_date / ruling_date после заседания
  # по заявлению), cassation (обжалование определения по ч. 4 ст. 324 АПК), prepare-hearing.
  # Пока не реализовано — на это поведение НЕ опираться: enforcement-adjustment собирает
  # реквизиты в диалоге сам, а результат вносит своим микро-шагом. Заведено пунктом в OPEN-ITEMS.
  enforcement:
    origin: computed                # computed (ведёт enforcement-adjustment) |
                                    # intake (зафиксировано init-case при входе на стадии исполнения)
    _set_by: null                   # enforcement-adjustment | settlement | init-case | analyze-hearing
    _set_date: null                 # дата записи (ISO)

    our_role: null                  # debtor | creditor — кто НАШ клиент в исполнении.
                                    # writes: enforcement-adjustment (фаза 0), init-case, legal-review
                                    # Выводится из case.our_client.party_id + parties[].role и
                                    # ПОДТВЕРЖДАЕТСЯ у Сюзерена: процессуальная роль в деле и роль
                                    # в исполнении расходятся (истец, проигравший встречный иск,
                                    # оказывается должником). Право по ч. 1 ст. 324 АПК есть у ОБЕИХ
                                    # сторон, поэтому от роли зависит всё: что доказываем, за кого
                                    # играет red team, какие подвиды вообще доступны
                                    # (termination — только взыскателю и приставу, п. 26 ППВС № 50
                                    # от 17.11.2015). Без этого поля скилл по умолчанию считал
                                    # клиента должником — и для взыскателя строил чужую аргументацию.

    # --- Исполнительный лист ---
    # ДО ЭТОГО БЛОКА реквизиты ИЛ в схеме отсутствовали, хотя settlement на стадии исполнения
    # печатает их в просительной части дословно («исполнительный лист серии {серия} № {номер}»)
    # и собирал в диалоге, никуда не записывая (тихая потеря, найдена при F.21).
    writ_series: null               # Серия ИЛ (например, "ФС")
    writ_number: null               # Номер ИЛ
    writ_issued_date: null          # Дата выдачи, ГГГГ-ММ-ДД
    writ_issued_by: null            # Суд, выдавший лист (он же адресат заявления по ст. 324 АПК)
    writ_deadline: null             # Срок предъявления к исполнению (3 года).
                                    # ВАЖНО: при предоставленной отсрочке/рассрочке считается
                                    # СО ДНЯ ОКОНЧАНИЯ её срока (п. 1 ч. 1 ст. 321 АПК),
                                    # при приостановлении время приостановления не засчитывается
                                    # (ч. 2 ст. 321 АПК). Пересчитывать при adjustment.result='granted'.

    # --- Исполнительное производство ---
    proceeding_number: null         # Номер ИП (постановление о возбуждении)
    proceeding_started_date: null   # Дата возбуждения ИП, ГГГГ-ММ-ДД
    bailiff_name: null              # ФИО судебного пристава-исполнителя
    bailiff_office: null            # Наименование отдела ФССП
    consolidated: null              # true | false | null — включено ли в СВОДНОЕ исполнительное
                                    # производство. Важно дважды: вопрос об отсрочке решается
                                    # по КОНКРЕТНОМУ исполнительному документу, а не по сводному
                                    # в целом (п. 24 ППВС № 50 от 17.11.2015); и смешанное сводное
                                    # ИП (листы АС + СОЮ) НЕ уводит вопрос в СОЮ — его разрешает
                                    # арбитражный суд (п. 4 того же постановления).
    debt_remaining: null            # Остаток задолженности (число), на дату ниже
    debt_remaining_date: null       # На какую дату снят остаток, ГГГГ-ММ-ДД
    enforcement_fee: null           # Исполнительский сбор (число), если взыскан.
                                    # При рассрочке исчисляется от НЕИСПОЛНЕННЫХ (просроченных)
                                    # требований (п. 76 ППВС № 50 от 17.11.2015).

    # --- Заявление о корректировке исполнения (ведёт enforcement-adjustment) ---
    adjustment:
      mode: null                    # request     — наше заявление
                                    # objection   — возражения на заявление оппонента
                                    #               (в ГПК по умолчанию вырождается в частную жалобу:
                                    #                ст. 203.1 — рассмотрение без извещения сторон)
                                    # termination — заявление о прекращении отсрочки/рассрочки
                                    #               (п. 26 ППВС № 50 от 17.11.2015; заявитель —
                                    #                только взыскатель или пристав)
      kind: null                    # deferral      — отсрочка       ┐ стандарт: «неустранимые
                                    # installment   — рассрочка      ┘ обстоятельства», п. 25 ППВС № 50
                                    # method_change — изменение способа и порядка исполнения
                                    #                 ⚠️ СТАНДАРТ ПЕРЕСМАТРИВАЕТСЯ. Прежний комментарий
                                    #                 («мягче: очевидные затруднения, п. 35 ППВС № 50»)
                                    #                 НЕВЕРЕН и снят: п. 35 посвящён окончанию
                                    #                 исполнительного производства в связи с фактическим
                                    #                 исполнением и стандарта для изменения способа
                                    #                 не содержит. До внесения выверенной формулировки
                                    #                 опираться на п. 25 и не заявлять пониженной планки.
                                    # fee           — отсрочка/рассрочка взыскания исполнительского
                                    #                 сбора, уменьшение размера, освобождение
                                    #                 (ч. 2.1 ст. 324 АПК — ПРОЦЕДУРА; правовой тест
                                    #                  даётся пп. 74–75 ППВС № 50, вносится отдельно.
                                    #                  Госпошлиной НЕ облагается — п. 79 того же акта)
      applicant: null               # us | opponent | bailiff — кто подал заявление.
                                    # ⚠️ Это НЕ то же, что наша роль в исполнении: см.
                                    # case.enforcement.our_role. Возражать против чужого заявления
                                    # может и должник, и взыскатель — от роли зависит вся аргументация.
      code: null                    # АПК | ГПК | КАС — определяет процедуру (три РАЗНЫХ режима:
                                    # АПК — месяц, заседание с извещением;
                                    # ГПК — 10 дней, БЕЗ заседания и БЕЗ извещения (ст. 203.1);
                                    # КАС — 10 дней, заседание с извещением)
      basis_norm: null              # Норма-основание ("ч. 1 ст. 324 АПК", "ст. 203 ГПК", "ст. 358 КАС")
      court: null                   # Суд, в который подано. По АПК/КАС — выдавший исполнительный
                                    # документ; по ГПК — рассмотревший дело ЛИБО по месту исполнения
                                    # (ст. 434 ГПК — альтернатива, которой в АПК нет)
      fee_amount: null              # Уплаченная госпошлина. 10 000 ₽ по пп. 15 п. 1 ст. 333.21 НК (АС);
                                    # 3 000 ₽ по пп. 13 п. 1 ст. 333.19 НК (СОЮ); 0 при kind='fee'
      # --- ЧТО ПРОСИМ (пишет enforcement-adjustment при подготовке документа) ---
      requested_until: null         # Для отсрочки — дата, до которой ПРОСИМ. Это наше требование,
                                    # а не состоявшийся факт: writ_deadline от него НЕ пересчитывается.
      requested_schedule: []        # Для рассрочки — ПРЕДЛАГАЕМЫЙ график (та же структура, что schedule)

      # --- ХОД ДЕЛА ---
      draft_date: null              # Дата, когда документ подготовлен (по образцу settlement.draft_date).
                                    # Подготовлен ≠ подан: in_progress здесь ещё false.
      filed_date: null              # Дата подачи заявления, ГГГГ-ММ-ДД
      filed_date_source: null       # user | document — откуда взята дата подачи
                                    # (по образцу pretrial_date_source у draft-claim)
      hearing_date: null            # Дата заседания (для ГПК обычно null — заседания нет)
      ruling_date: null             # Дата определения суда
      ruling_date_evidence: null    # [doc-NNN] определения суда в index.yaml — чем подтверждён результат
      result: null                  # granted | partial | denied | terminated | null
                                    #   terminated — отсрочка/рассрочка прекращена по п. 26

      # --- ЧТО СУД ДАЛ (пишется ТОЛЬКО после определения; до него — null) ---
      granted_until: null           # Для отсрочки — дата, до которой она ПРЕДОСТАВЛЕНА судом.
                                    # ⚠️ Только результат. От неё пересчитывается writ_deadline
                                    # (п. 1 ч. 1 ст. 321 АПК) — поэтому заполнение её до определения
                                    # суда даёт неверный срок предъявления исполнительного листа.
                                    # То, что мы просим, живёт в requested_until.
      schedule: []                  # Для рассрочки — УТВЕРЖДЁННЫЙ судом график платежей:
                                    #   - date: ГГГГ-ММ-ДД
                                    #     amount: число
                                    #     paid: true | false | null
                                    # Нарушение графика — основание для mode='termination' (п. 26).
                                    # Предлагаемый нами график — в requested_schedule.
      method_change_to: null        # Для kind='method_change' — на что меняем
                                    # (например, "взыскание стоимости вещи вместо передачи в натуре")
      security_measures: null       # true | false | null — заявлялись ли взыскателем обеспечительные
                                    # меры по ч. 3 ст. 324 АПК после предоставления отсрочки.
                                    # Обязательный вопрос: выигранная отсрочка может обернуться
                                    # арестом активов — предупредить доверителя ДО подачи.
      in_progress: false            # true пока заявление на рассмотрении (между filed_date
                                    # и ruling_date); false после определения или отзыва заявления.
                                    # ⚠️ Поднимается ТОЛЬКО когда подача состоялась, то есть вместе
                                    # с filed_date. На этапе подготовки документа (draft_date) — false:
                                    # иначе карточка сообщает о рассмотрении, которого нет.

    # История ранее поданных заявлений по корректировке исполнения.
    # writes: enforcement-adjustment
    # Блок adjustment выше — ТЕКУЩЕЕ (последнее) заявление. Когда по нему вынесено определение
    # и начинается работа над следующим, завершённое целиком переносится сюда, а adjustment
    # обнуляется. Без этого второй эпизод затирал первый — а эпизодов штатно бывает несколько:
    # повторное заявление после отказа, заявление оппонента (applicant: opponent), заявление
    # пристава, разные kind по одному листу. Проверка «подавали ли мы такое раньше» (фаза 0)
    # обязана смотреть И сюда, иначе не увидит собственной истории и спутает наше заявление с чужим.
    adjustment_history: []          # список объектов той же структуры, что adjustment

  # Хронология (пополняется по ходу дела)
  # writes (append): init-case (создание), analyze-hearing (после заседания),
  #                  appeal/cassation (подача и результат), legal-review (значимые правовые события)
  timeline:
    - date: null                    # ГГГГ-ММ-ДД
      event: "Описание события"
      source: user                  # user | transcript | agent
